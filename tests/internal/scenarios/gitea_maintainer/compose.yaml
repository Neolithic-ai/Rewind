# Gitea "repo maintainer" scenario.
#
#   default  the agent's workstation; its bash tool runs here. BASH_ENV points at
#            a file written by the seed (GITEA_URL / GITEA_TOKEN / GITEA_USER), so
#            every non-interactive `bash -c` sees the agent's credentials.
#   gitea    Gitea 1.22 on SQLite (WAL mode, so the pre-snapshot checkpoint hook
#            matters), data in the named volume `gitea-data` at /data.
#   ci       a tiny stdlib-Python CI (ci/ci.py): Gitea webhook -> clone ->
#            pytest -> commit status. Run history + logs live in `ci-data`.
services:
  default:
    build:
      context: .
      dockerfile: Dockerfile.workstation
    image: rewind-gm-workstation:latest
    init: true
    environment:
      - BASH_ENV=/root/.agent_env

  gitea:
    image: gitea/gitea:1.22
    init: true
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__database__SQLITE_JOURNAL_MODE=WAL
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://gitea:3000/
      - GITEA__server__OFFLINE_MODE=true
      - GITEA__server__DISABLE_SSH=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__repository__DEFAULT_BRANCH=main
      - GITEA__indexer__ISSUE_INDEXER_TYPE=db
      # The CI lives on the private compose network.
      - GITEA__webhook__ALLOWED_HOST_LIST=*
      - GITEA__log__LEVEL=Error
    volumes:
      - gitea-data:/data

  ci:
    image: rewind-gm-workstation:latest
    init: true
    command: ["python3", "-u", "/opt/ci/ci.py"]
    environment:
      - CI_GITEA_URL=http://gitea:3000
      - CI_REPO=acme/calc
      - CI_STATE_DIR=/var/lib/ci
      # Simulated queue time, so a snapshot right after "open PR" is reliably
      # taken *before* CI posts its status.
      - CI_QUEUE_DELAY=4
    volumes:
      - ./ci:/opt/ci:ro
      - ci-data:/var/lib/ci

volumes:
  gitea-data:
  ci-data:
