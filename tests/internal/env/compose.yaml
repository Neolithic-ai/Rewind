# Inspect-style Docker sandbox for the rewind PoC.
#
# Two services:
#   default  - the "attacker": Debian slim with bash/curl/git/procps. The
#              agent's bash tool runs here (Inspect's default sandbox service).
#   target   - Gitea (SQLite, install pre-locked) with its data in the named
#              volume `gitea-data` mounted at /data (Gitea's data dir for the
#              official image). Also holds /opt/target/secret.txt and a
#              monitor.sh heartbeat loop (both created at setup time).
#
# This file is used directly by `docker compose` (our own checkpoint engine in
# tests/internal/poc/env.py drives it). It is a valid Inspect sandbox compose file too.
services:
  default:
    build:
      context: .
      dockerfile: Dockerfile.attacker
    image: rewind-attacker:latest
    init: true
    # No ports published: the attacker reaches Gitea over the compose network
    # at http://target:3000.

  target:
    image: gitea/gitea:1.22
    init: true
    environment:
      - USER_UID=1000
      - USER_GID=1000
      # Pre-lock the installer so the API works immediately on first boot.
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__database__PATH=/data/gitea/gitea.db
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://target:3000/
      - GITEA__server__OFFLINE_MODE=true
      - GITEA__log__LEVEL=Error
    volumes:
      # Gitea keeps repos + the SQLite DB under /data (a named volume so it is
      # captured/restored as a unit).
      - gitea-data:/data

volumes:
  gitea-data:
