name: evals
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Inspect model string (openrouter/<provider>/<model>)"
        required: true
        default: openrouter/anthropic/claude-sonnet-5
      attempts:
        description: "Full attempts"
        required: true
        default: "3"
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_APP_URL: https://github.com/${{ github.repository }}
      OPENROUTER_APP_TITLE: ${{ github.event.repository.name }}
      MODEL: ${{ inputs.model || 'openrouter/anthropic/claude-sonnet-5' }}
      ATTEMPTS: ${{ inputs.attempts || '3' }}
      BUDGET_USD: "10"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Run evals
        run: |
          bash tests/internal/scenarios/gitea_maintainer/real_agent.sh \
            --model "$MODEL" --attempts "$ATTEMPTS" --budget-usd "$BUDGET_USD"
      # Raw eval metadata and transcripts can contain environment credentials.
      # Keep them off public Actions artifacts.
